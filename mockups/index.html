<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MusicMaker UI Mockups</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #0f1420;
      color: #e8ecf4;
    }

    body {
      box-sizing: border-box;
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #aab4ca;
    }

    ul {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      padding: 0;
      margin-top: 28px;
      list-style: none;
    }

    a {
      display: block;
      padding: 16px;
      border: 1px solid #2b3550;
      border-radius: 12px;
      background: #151c2c;
      color: #2ee6a6;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      border-color: #2ee6a6;
      outline: none;
    }
  </style>
</head>
