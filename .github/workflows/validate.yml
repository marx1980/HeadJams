name: Validate

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Offline acceptance check
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          npx vite preview --port 5199 &
          sleep 3
          node scripts/offline-check.cjs
      - name: Include UI mockups in Pages artifact
        run: |
          mkdir -p dist/mockups dist/docs/mockups
          cp mockups/index.html dist/mockups/index.html
          cp docs/mockups/*.html dist/docs/mockups/
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
